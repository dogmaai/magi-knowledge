name: OKF Conformance + LILITH Boundary

on:
  push:
    branches: [main]
  pull_request:

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: OKF lint + LILITH contamination check
        run: python scripts/okf_lint.py
      - name: LILITH-safe loader smoke test
        run: python scripts/test_lilith_safe_loader.py
      - name: Cross-unit detector covers unit registry
        run: python scripts/check_unit_detector_sync.py
