name: AI Search R2 Sync

on:
  push:
    branches: [main]
    paths:
      - "system/**"
      - "scripts/ai_search_r2_sync.py"
      - "scripts/okf_common.py"
      - ".github/workflows/ai-search-sync.yml"
  workflow_dispatch:

concurrency:
  group: ai-search-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: AWS CLI version
        run: aws --version

      - name: Dry run
        run: |
          python scripts/ai_search_r2_sync.py \
            --bucket magi-system \
            --prefix okf/system \
            --dry-run

      - name: Sync OKF system/ to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          python scripts/ai_search_r2_sync.py \
            --bucket magi-system \
            --prefix okf/system \
            --prune
