name: R2 Data Catalog Sync

on:
  push:
    branches: [main]
    paths:
      - "system/**"
      - "index.md"
      - "scripts/r2_catalog_sync.py"
      - "scripts/okf_common.py"
      - ".github/workflows/r2-catalog-sync.yml"
  workflow_dispatch:

concurrency:
  group: r2-catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install PyIceberg
        run: pip install "pyiceberg[pyarrow]"
      - name: Dry run (row count sanity check)
        run: python scripts/r2_catalog_sync.py --dry-run
      - name: Sync system/ tree to okf.system
        env:
          CLOUDFLARE_R2_CATALOG_TOKEN: ${{ secrets.CLOUDFLARE_R2_CATALOG_TOKEN }}
        run: python scripts/r2_catalog_sync.py
