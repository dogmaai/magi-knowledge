name: OKF Freshness

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fail on concepts past their stale_after
        run: python scripts/okf_lint.py --fail-on-stale
